<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - E-spirit</title>
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="standalone">
        <div class="standalone-inner">
            <!-- Căn giữa khối card nhưng để chữ bên trong căn trái theo chuẩn thiết kế -->
            <div class="standalone-card" style="text-align: left;">

                <h1 style="margin-bottom: 8px;">Đặt lại mật khẩu</h1>
                <p class="desc" style="margin-bottom: 24px;">Tại một mật khẩu mới, khác với mật khẩu bạn đã sử dụng trước đây</p>

                <div class="alert alert-error" id="apiAlert" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span id="apiAlertMessage">Đã có lỗi xảy ra.</span>
                </div>

                <form id="resetPasswordForm">

                    <div class="field" id="newPasswordField" style="margin-bottom: 16px;">
                        <label for="newPassword" style="display: block; margin-bottom: 8px; font-weight: 600;">Mật khẩu mới</label>
                        <!-- Ép position relative để giữ icon Mắt không bị văng ra ngoài -->
                        <div class="input-wrap" style="position: relative; width: 100%;">
                            <input type="password" id="newPassword" class="input has-icon-right" placeholder="Tạo mật khẩu mới" style="width: 100%; box-sizing: border-box;">
                            <button type="button" class="icon-btn" id="toggleNewPw" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A39C90" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <div class="field-msg error-msg" id="newPasswordError" style="display: none;">Mật khẩu không hợp lệ</div>
                    </div>

                    <div class="field" id="confirmPasswordField" style="margin-bottom: 24px;">
                        <label for="confirmPassword" style="display: block; margin-bottom: 8px; font-weight: 600;">Xác nhận mật khẩu mới</label>
                        <div class="input-wrap" style="position: relative; width: 100%;">
                            <input type="password" id="confirmPassword" class="input has-icon-right" placeholder="Nhập lại mật khẩu mới" style="width: 100%; box-sizing: border-box;">
                            <button type="button" class="icon-btn" id="toggleConfirmPw" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A39C90" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>

                        <div class="pw-strength" style="margin-top: 12px;">
                            <div class="pw-bars">
                                <div class="pw-bar" id="strengthBar1"></div>
                                <div class="pw-bar" id="strengthBar2"></div>
                                <div class="pw-bar" id="strengthBar3"></div>
                            </div>
                            <div class="pw-reqs">
                                <div class="pw-req" id="reqLength"><div class="dot"></div>Từ 8 ký tự</div>
                                <div class="pw-req" id="reqUpper"><div class="dot"></div>Có chữ hoa</div>
                                <div class="pw-req" id="reqNumber"><div class="dot"></div>Có chữ số</div>
                            </div>
                        </div>
                        <div class="field-msg error-msg" id="confirmPasswordError" style="display: none;">Mật khẩu không khớp</div>
                    </div>

                    <!-- Ép chiều rộng nút bằng 100% -->
                    <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%;">
                        <span id="btnText">Đặt lại mật khẩu</span>
                        <div class="spinner" id="loadingSpinner" style="display: none;"></div>
                    </button>

                </form>

            </div>
        </div>
    </main>

    <script src="../../js/auth/reset_password.js"></script>

</body>
</html>
