<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — E-SPIRIT</title>
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="standalone">
    <div class="standalone-inner">
      <div class="standalone-logo">
        <a href="../../index.html" class="logo">
          <svg class="logo-mark" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="#7A1F2B" stroke-width="1.4"/>
            <circle cx="20" cy="20" r="13" stroke="#C8A45D" stroke-width="1" opacity="0.7"/>
            <path d="M14 13H26M14 20H23M14 27H26" stroke="#7A1F2B" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span class="logo-word on-light">E-SPIRIT</span>
        </a>
      </div>
      <div class="standalone-card">
        <h1>Đặt lại mật khẩu</h1>
        <p class="desc">Tạo một mật khẩu mới, khác với mật khẩu bạn đã sử dụng trước đây.</p>

        <form id="resetForm" novalidate>
          <div class="field">
            <label for="reset-pw">Mật khẩu mới</label>
            <div class="input-wrap">
              <input class="input has-icon-right" type="password" id="reset-pw" name="password" placeholder="Tạo mật khẩu mới" data-validate="password" data-strength-target="-2" required>
              <button type="button" class="icon-btn" data-toggle-pw="reset-pw" aria-label="Hiện mật khẩu">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
              </button>
            </div>
            <div class="pw-strength" id="pw-strength-2" style="display:none;">
              <div class="pw-bars">
                <div class="pw-bar" id="bar1-2"></div><div class="pw-bar" id="bar2-2"></div><div class="pw-bar" id="bar3-2"></div>
              </div>
              <div class="pw-label" id="pw-label-2"></div>
              <div class="pw-reqs">
                <div class="pw-req" id="req-len-2"><span class="dot"></span>Ít nhất 8 ký tự</div>
                <div class="pw-req" id="req-upper-2"><span class="dot"></span>Có chữ hoa</div>
                <div class="pw-req" id="req-lower-2"><span class="dot"></span>Có chữ thường</div>
                <div class="pw-req" id="req-num-2"><span class="dot"></span>Có số</div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="reset-confirm">Xác nhận mật khẩu mới</label>
            <div class="input-wrap">
              <input class="input has-icon-right" type="password" id="reset-confirm" name="confirmPassword" placeholder="Nhập lại mật khẩu mới" data-validate="confirm-password" data-match="#reset-pw" required>
              <button type="button" class="icon-btn" data-toggle-pw="reset-confirm" aria-label="Hiện mật khẩu">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
              </button>
            </div>
          </div>

          <button class="btn btn-primary" type="submit" id="resetSubmit" style="margin-top:6px;">
            <span>Đặt lại mật khẩu</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/auth/validation.js"></script>
  <script src="../../js/auth/reset-password.js"></script>
</body>
</html>
