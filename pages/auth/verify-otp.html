<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh email - E-SPIRIT</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@400;500;600;700&family=Libertinus+Math&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">

    <style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #F6F3E9;
}

/* PAGE */
.standalone {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #F6F3E9;
    max-width: none !important;
}

.standalone-inner {
    width: 575px !important;
    max-width: none !important;
    height: 660px;
    display: flex;
    justify-content: center;
}

.standalone-card {
    position: relative;
    width: 575px !important;
    max-width: none !important;
    min-width: 575px !important;
    height: 660px;
    margin: 0;
    padding: 0;
    border-radius: 30px;
    background: #FFFFFF;
    border: none;
    box-shadow: 0px 4px 7px 2px #0000001A;
    text-align: center;
}

/* ICON */
.verify-icon {
    position: absolute;
    top: 20px;
    left: 50%;
    width: 119px;
    height: 119px;
    margin: 0;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.verify-icon img {
    width: 119px;
    height: 119px;
    display: block;
    object-fit: contain;
}

/* TIÊU ĐỀ */
.standalone-card h1 {
    position: absolute;
    top: 130px;
    left: 50%;
    width: 231px;
    height: 41px;
    margin: 0;
    transform: translateX(-50%);
    font-family: "Libertinus Math", serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 100%;
    letter-spacing: 0%;
    color: #000000;
    text-align: center;
}

/* MÔ TẢ */
.desc.otp-description {
    position: absolute;
    top: 202px;
    left: 50%;
    width: 500px;
    height: 60px;
    margin: 0;
    transform: translateX(-50%);
    font-family: "Afacad Flux", sans-serif;
    font-size: 24px !important;
    font-weight: 500;
    line-height: 30px;
    color: #797572;
    text-align: center;
}

.otp-email {
    font-weight: 700;
    color: #797572;
}

/* FORM */
.otp-form {
    position: absolute;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
}

/* 6 Ô OTP */
.otp-inputs {
    position: absolute;
    top: 300px;
    left: 50%;
    width: 479px;
    height: 77px;
    margin: 0;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.otp-input {
    flex: 0 0 66px;
    width: 66px;
    height: 77px;
    padding: 0;
    border: 2px solid #E4E1D8;
    border-radius: 9px;
    background: #FFFFFF;
    outline: none;
    text-align: center;
    font-family: "Afacad Flux", sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #292522;
    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.otp-input:focus {
    border-color: #7A2830;
    box-shadow: 0 0 0 3px rgba(122, 40, 48, 0.08);
}

/* ERROR */
.otp-error {
    position: absolute;
    top: 385px;
    left: 50%;
    width: 479px;
    height: 24px;
    margin: 0;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Afacad Flux", sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: #D32F2F;
    visibility: hidden;
}
.otp-error.show {
    visibility: visible;
}

/* TIMER */

.otp-timer {
    display: none;
}

/* GỬI LẠI MÃ */
.resend-wrapper {
    position: absolute;
    top: 419px;
    left: 50%;
    width: 479px;
    margin: 0;
    transform: translateX(-50%);
    text-align: center;
}

.resend-wrapper::before {
    content: "Bạn chưa nhận được email?";
    display: block;
    margin: 0 0 7px;
    font-family: "Afacad Flux", sans-serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 20px;
    color: #777570;
}

.resend-button {
    border: none;
    background: transparent;
    padding: 0;
    font-family: "Afacad Flux", sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 23px;
    color: #7A2830;
    cursor: pointer;
}

/* NÚT XÁC MINH */
#verifyOtpButton {
    position: absolute;
    top: 510px;
    left: 50%;
    width: 479px;
    height: 63px;
    margin: 0;
    transform: translateX(-50%);
    border: none;
    border-radius: 8px;
    background: #7A2830;
    color: #FFFFFF;
    font-family: "Afacad Flux", sans-serif;
    font-size: 23px;
    font-weight: 600;
    line-height: 29px;
    cursor: pointer;
}

#verifyOtpButton:hover {
    background: #682129;
}

/* MOBILE */
@media (max-width: 600px) {
    .standalone {
        padding: 20px 16px;
    }

    .standalone-inner {
        width: 100%;
        height: auto;
        flex: none;
    }

    .standalone-card {
        width: 100% !important;
        min-width: 0;
        height: 660px !important;
        min-height: 660px;
        border-radius: 22px;
    }

    .otp-form {
        width: calc(100% - 48px);
        max-width: 435px;
    }

    .otp-inputs {
        width: 100%;
        gap: 8px;
    }

    .otp-input {
        flex: 1 1 0;
        width: auto;
        height: 62px;
        line-height: normal;
    }

    #verifyOtpButton {
        width: 100%;
    }
}
    
    </style>
</head>

                <!-- TITLE -->
                <h1>Xác minh email</h1>

                <!-- DESCRIPTION -->
                <p class="desc otp-description">
                    Mã xác minh đã được gửi đến email<br>
                    <span class="otp-email" id="otpEmail">ntt@gmail.com</span> của bạn.
                </p>

                <!-- OTP FORM -->
                <form id="verifyOtpForm" class="otp-form" novalidate>

                    <div class="otp-inputs" id="otpInputs">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="OTP số 1">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP số 2">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP số 3">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP số 4">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP số 5">
                        <input class="otp-input" type="text" inputmode="numeric" maxlength="1" aria-label="OTP số 6">
                    </div>

                    <!-- ERROR -->
                    <div class="otp-error" id="otpError">
                        <span id="otpErrorText">OTP không hợp lệ.</span>
                    </div>

                    <!-- TIMER: giữ ID để verify-otp.js không lỗi -->
                    <div class="otp-timer" id="otpTimer">
                        Mã OTP hết hạn sau
                        <strong id="countdown">01:00</strong>
                    </div>

                    <!-- RESEND -->
                    <div class="resend-wrapper">
                        <button type="button" class="resend-button" id="resendOtp">
                            Gửi lại mã
                        </button>
                    </div>

                    <!-- VERIFY -->
                    <button type="submit" class="btn btn-primary" id="verifyOtpButton">
                        <span id="verifyButtonText">Xác minh</span>
                    </button>

                </form>
            </section>
