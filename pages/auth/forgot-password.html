<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — E-SPIRIT</title>
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="standalone">
    <div class="standalone-inner">
      <div class="standalone-logo">
        <a href="../../index.html" class="logo">
          <svg class="logo-mark" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="19" stroke="#7A1F2B" stroke-width="1.4"/>
            <circle cx="20" cy="20" r="13" stroke="#C8A45D" stroke-width="1" opacity="0.7"/>
            <path d="M14 13H26M14 20H23M14 27H26" stroke="#7A1F2B" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span class="logo-word on-light">E-SPIRIT</span>
        </a>
      </div>
      <div class="standalone-card">
        <a href="login.html" class="back-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Quay lại đăng nhập
        </a>

        <div id="forgot-default">
          <h1>Quên mật khẩu?</h1>
          <p class="desc">Nhập email bạn đã sử dụng để đăng ký. Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
          <form id="forgotForm" novalidate>
            <div class="field">
              <label for="forgot-email">Email</label>
              <input class="input" type="email" id="forgot-email" name="email" placeholder="Nhập email của bạn" data-validate="email" required>
            </div>
            <button class="btn btn-primary" type="submit" id="forgotSubmit" style="margin-top:6px;">
              <span>Gửi liên kết đặt lại mật khẩu</span>
            </button>
          </form>
        </div>

        <div id="forgot-sent" class="text-center" style="display:none;">
          <div class="center-icon tone-primary">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 7l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke="#7A1F2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h1>Kiểm tra email của bạn</h1>
          <p class="desc">Chúng tôi đã gửi hướng dẫn đặt lại mật khẩu đến <b id="forgot-sent-email"></b>.</p>
          <a href="reset-password.html" class="btn btn-primary" style="text-decoration:none;"><span>Đến trang đặt lại mật khẩu</span></a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/auth/validation.js"></script>
  <script src="../../js/auth/forgot-password.js"></script>
</body>
</html>
