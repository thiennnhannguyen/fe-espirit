<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu - E-SPIRIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/responsive.css">

    <!-- CSS RIÊNG CHO POPUP -->
    <style>

        /* Success Popup */
        .success-modal-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9999;
        }

        /* Khi popup bị hidden */
        .success-modal-overlay[hidden] {
            display: none;
        }

        /* Hộp popup */
        .success-modal {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: popupShow 0.2s ease-out;
        }

        /* Icon thành công */
        .success-modal-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(122, 31, 43, 0.1);
            color: #7A1F2B;
        }

        /* Tiêu đề popup */
        .success-modal h2 {
            margin: 0 0 10px;
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            color: #2b2520;
        }

        /* Nội dung popup */
        .success-modal p {
            margin: 0 0 24px;
            color: #6f6860;
            line-height: 1.6;
            font-size: 15px;
        }

        /* Email */
        .success-modal strong {
            color: #7A1F2B;
        }

        /* Animation */
        @keyframes popupShow {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsive riêng cho popup */
        @media (max-width: 480px) {
            .success-modal {
                padding: 24px;
            }
            .success-modal h2 {
                font-size: 26px;
            }
        }

        /* Căn chỉnh form Forgot Password */
        #forgotForm {
            width: 100%;
        }
        #forgotEmailField {
            width: 100%;
        }
        #forgotEmail {
            width: 100%;
            box-sizing: border-box;
            display: block;
        }
        #forgotSubmit {
            width: 100%;
            box-sizing: border-box;
            display: block;
        }
    </style>
</head>
<body>

    <!-- MAIN -->
    <main class="standalone">
        <div class="standalone-inner">

            <!-- LOGO -->
            <div class="standalone-logo">
                <a href="login.html" class="logo">
                    <svg
                        class="logo-mark"
                        viewBox="0 0 40 40"
                        fill="none"
                    >
                        <circle
                            cx="20"
                            cy="20"
                            r="19"
                            stroke="#7A1F2B"
                            stroke-width="1.4"
                        />
                        <circle
                            cx="20"
                            cy="20"
                            r="13"
                            stroke="#C8A45D"
                            stroke-width="1"
                            opacity="0.7"
                        />
                        <path
                            d="M14 13H26M14 20H23M14 27H26"
                            stroke="#7A1F2B"
                            stroke-width="2.4"
                            stroke-linecap="round"
                        />
                    </svg>
                    <span class="logo-word on-light">
                        E-SPIRIT
                    </span>
                </a>
            </div>

            <!-- FORGOT PASSWORD CARD -->
            <section class="standalone-card">

                <!-- Quay lại đăng nhập -->
                <a
                    href="login.html"
                    class="back-link"
                >
                    <svg
                        width="15"
                        height="15"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <path
                            d="M19 12H5M12 19l-7-7 7-7"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    Quay lại đăng nhập
                </a>

                <!-- Tiêu đề -->
                <h1>
                    Quên mật khẩu?
                </h1>

                <!-- Mô tả -->
                <p class="desc">
                    Nhập email bạn đã sử dụng để đăng ký.
                    Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.
                </p>

                <!-- FORM -->
                <form
                    id="forgotForm"
                    novalidate
                >

                    <!-- Email -->
                    <div
                        class="field"
                        id="forgotEmailField"
                    >
                        <label for="forgotEmail">
                            Email
                        </label>
                        <input
                            class="input"
                            type="email"
                            id="forgotEmail"
                            name="email"
                            placeholder="Nhập email của bạn"
                            autocomplete="email"
                        />

                        <!-- Email Error -->
                        <div
                            class="field-msg error-msg"
                            id="forgotEmailError"
                            style="display: none;"
                        >
                            <svg
                                width="13"
                                height="13"
                                viewBox="0 0 24 24"
                                fill="none"
                            >
                                <path
                                    d="M12 8v5M12 16h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                            <span id="forgotEmailErrorText">
                                Vui lòng nhập email hợp lệ.
                            </span>
                        </div>
                    </div>

                    <!-- SEND BUTTON -->
                    <button
                        class="btn btn-primary"
                        type="submit"
                        id="forgotSubmit"
                    >
                        <span id="forgotSubmitText">
                            Gửi liên kết đặt lại mật khẩu
                        </span>
                    </button>
                </form>
            </section>
        </div>
    </main>

    <!-- SUCCESS POPUP -->
    <div
        class="success-modal-overlay"
        id="successModal"
        hidden
    >
        <div
            class="success-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="successModalTitle"
        >

            <!-- Icon -->
            <div class="success-modal-icon">
                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                >
                    <path
                        d="M20 6L9 17l-5-5"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </div>

            <!-- Title -->
            <h2 id="successModalTitle">
                Gửi thành công
            </h2>

            <!-- Message -->
            <p>
                Liên kết đặt lại mật khẩu đã được gửi đến
                <strong id="successEmail">
                    email của bạn
                </strong>.
            </p>

            <!-- Continue -->
            <button
                type="button"
                class="btn btn-primary"
                id="continueVerifyOtp"
            >
                Tiếp tục
            </button>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../../js/auth/forgot-password.js"></script>
</body>
</html>
