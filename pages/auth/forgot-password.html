<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
    content="width=device-width, initial-scale=1.0"
    >
<title>Quên mật khẩu - E-SPIRIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
    >
<link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Libertinus+Math&display=swap"
    rel="stylesheet"
    >
    <!-- CSS của project -->
<link rel="stylesheet"
    href="../../css/components.css"
    >
<link rel="stylesheet"
    href="../../css/responsive.css"
    >
<style>

    /* RESET */
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        padding: 0;
        background: #F6F3E9;
    }

    /* TRANG */
    .forgot-page {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: #F6F3E9;
    }

    /* CARD */
    .forgot-card {
        width: 575px;
        height: 507px;
        padding: 60px 44px 50px;
        background: rgba(255, 255, 255, 0.72);
        border: none;
        border-radius: 27px;
        box-shadow:
            0 3px 8px rgba(0, 0, 0, 0.10);
    }

    /* QUAY LẠI ĐĂNG NHẬP */
    .forgot-back {
        width: 150px;
        height: 27px;
        display: flex;
        align-items: center;
        width: fit-content;
        gap: 8px;
        margin-bottom: 27px;
        text-decoration: none;
        font-family: "Afacad Flux", sans-serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 100%;
        color: #9D9D9B;
        transition: color 0.2s ease;
    }
    .forgot-back:hover {
        color: #777570;
    }
    .forgot-back-arrow {
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: 400;
        line-height: 1;
        color: #9D9D9B;
    }

    /* TIÊU ĐỀ */
    .forgot-title {
        width: 244px;
        height: 41px;
        margin: 0 0 21px;
        font-family: "Libertinus Math", serif;
        font-size: 36px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        color: #000000;
    }

    /* MÔ TẢ */
    .forgot-description {
        width: 429px;
        height: 64px;
        margin: 0 0 37px;
        font-family: "Afacad Flux", sans-serif;
        font-size: 24px;
        font-weight: 500;
        line-height: 32px;
        letter-spacing: 0;
        color: #3C3D38;
    }

    /* FORM */
    .forgot-form {
        width: 100%;
    }

    /* INPUT */
    .forgot-input {
        width: 479px;
        height: 69px;
        padding: 0 20px;
        border: 2px solid #E4E1D8;
        border-radius: 8px;
        outline: none;
        background: #FFFFFF;
        font-family: "Afacad" , sans-serif;
        font-size: 20px;
        line-height: 1;
        letter-spacing: -2%;
        color: #292522;
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }
    .forgot-input::placeholder {
        color: #C4C0BD;
        opacity: 1;
        font-weight: 700;
    }
    .forgot-input:hover {
        border-color: #D7D1C7;
    }
    .forgot-input:focus {
        border-color: #7A1F2B;
        box-shadow:
            0 0 0 3px rgba(122, 31, 43, 0.08);
    }

    /* ERROR */
    .forgot-error {
        display: none;
        margin-top: 8px;
        font-family: "Afacad Flux", sans-serif;
        font-size: 13px;
        color: #B3261E;
    }
    .forgot-error.show {
        display: block;
    }

    /* BUTTON */
    .forgot-submit {
        width: 479px;
        height: 69px;
        margin-top: 22px;
        border: none;
        border-radius: 10px;
        background: #6F262D;
        color: #FBF6ED;
        font-family: "Afacad Flux", sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -2%;
        cursor: pointer;
        transition:
            background 0.2s ease,
            transform 0.1s ease;
    }
    .forgot-submit:hover {
        background: #6F262D;
    }
    .forgot-submit:active {
        transform: scale(0.99);
    }
    .forgot-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    /* SUCCESS */
    #forgot-sent {
        display: none;
    }

    /* MOBILE */
    @media (max-width: 600px) {
        .forgot-page {
            padding: 20px 16px;
        }
        .forgot-card {
            width: 100%;
            height: auto;
            padding: 40px 28px 42px;
            border-radius: 22px;
        }
        .forgot-back {
            margin-bottom: 30px;
            font-size: 15px;
        }
        .forgot-title {
            font-size: 32px;
            line-height: 34px;
        }
        .forgot-description {
            font-size: 18px;
            line-height: 25px;
            margin-bottom: 30px;
        }
        .forgot-input {
            height: 56px;
        }
        .forgot-submit {
            height: 58px;
            font-size: 16px;
        }
    }
</style>
</head>

<body>
    <main class="forgot-page">
        <section class="forgot-card">

            <!-- QUAY LẠI ĐĂNG NHẬP -->
            <a
                href="login.html"
                class="forgot-back"
            >
                <span class="forgot-back-arrow">
                    ←
                </span>
                <span>
                    Quay lại đăng nhập
                </span>
            </a>

            <!-- NỘI DUNG -->
            <div id="forgot-default">

                <!-- TIÊU ĐỀ -->
                <h1 class="forgot-title">
                    Quên mật khẩu?
                </h1>

                <!-- MÔ TẢ -->
                <p class="forgot-description">
                    Nhập email bạn đã sử dụng để đăng ký.<br>
                    Chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.
                </p>

                <!-- FORM -->
                <form
                    id="forgotForm"
                    class="forgot-form"
                    novalidate
                >
                    <div id="forgot-email-field">
                        <input
                            type="email"
                            id="forgot-email"
                            class="forgot-input"
                            placeholder="Nhập email của bạn"
                            autocomplete="email"
                        >
                        <div
                            class="forgot-error"
                            id="forgot-email-error"
                        >
                            Vui lòng nhập email hợp lệ.
                        </div>
                    </div>

                    <!-- BUTTON -->
                    <button
                        type="submit"
                        id="forgotSubmit"
                        class="forgot-submit"
                    >
                        Gửi liên kết đặt lại mật khẩu
                    </button>
                </form>
            </div>

            <!-- SUCCESS -->
            <div id="forgot-sent">
                <h1 class="forgot-title">
                    Kiểm tra email của bạn
                </h1>
                <p class="forgot-description">
                    Chúng tôi đã gửi hướng dẫn đặt lại mật khẩu
                    đến
                    <strong id="forgot-sent-email"></strong>.
                </p>
            </div>
        </section>
    </main>

    <script src="../../js/auth/forgot-password.js"></script>
</body>
</html>
